<!doctype html>
<html>
<body style="margin:0;padding:24px;background:#f7f7f8;font-family:-apple-system,'Segoe UI',sans-serif;color:#1b1b1f;">
  <div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #e3e3e8;border-radius:8px;padding:24px;">
    <h1 style="margin:0 0 12px;font-size:20px;">{{ alert.title() }}</h1>
    {% if let Some(summary) = summary %}
    <p style="margin:0 0 16px;line-height:1.5;">{{ summary }}</p>
    {% endif %}
    {% if let Some(log) = alert.log_tail %}
    <p style="margin:0 0 6px;color:#6b6b76;font-size:13px;">Last output</p>
    <pre style="margin:0 0 16px;padding:12px;background:#f7f7f8;border-radius:6px;font-size:12px;white-space:pre-wrap;word-break:break-word;">{{ log }}</pre>
    {% endif %}
    <a href="{{ alert.source.url }}" style="display:inline-block;padding:8px 14px;background:#4f46e5;color:#fff;border-radius:6px;text-decoration:none;font-weight:600;">Open in Monitor</a>
    <p style="margin:20px 0 0;color:#6b6b76;font-size:12px;">{{ alert.occurred_at.format("%Y-%m-%d %H:%M:%S UTC") }}</p>
  </div>
</body>
</html>
