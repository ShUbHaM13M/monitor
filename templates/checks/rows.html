{% for row in body.rows %}
<tr>
  <td><span class="pill {{ row.status.css() }}">{{ row.status.label() }}</span></td>
  <td><a href="/checks/{{ row.id }}">{{ row.name }}</a>{% if row.is_webhook %}<span class="tag">webhook</span>{% endif %}</td>
  <td class="mono">{{ row.schedule }}</td>
  <td>{{ row.last_ping|safe }}</td>
  <td>{{ row.next_due|safe }}</td>
</tr>
{% endfor %}
